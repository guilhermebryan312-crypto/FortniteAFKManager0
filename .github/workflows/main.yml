
name: Build Fortnite AFK Manager

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          mkdir -p source
          unzip -q FortniteAFKManager-Android-Starter.zip -d source
          test -f source/FortniteAFKManager/settings.gradle.kts

      - name: Check project files
        run: |
          test -f source/FortniteAFKManager/app/build.gradle.kts
          test -f source/FortniteAFKManager/app/src/main/java/com/guh/fortniteafkmanager/MainActivity.kt

      - name: Build APK
        run: gradle -p source/FortniteAFKManager --no-daemon clean assembleDebug

      - name: Verify APK
        run: test -s source/FortniteAFKManager/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fortnite-AFK-Manager-APK
          path: source/FortniteAFKManager/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
