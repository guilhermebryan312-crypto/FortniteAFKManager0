name: Build Fortnite AFK Manager

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        shell: bash
        run: |
          ZIP="FortniteAFKManager-Companion-v2-CORRIGIDO.zip"

          test -f "$ZIP" || {
            echo "ERRO: ZIP não encontrado na raiz do repositório."
            ls -la
            exit 1
          }

          mkdir -p source
          unzip -q "$ZIP" -d source

          SETTINGS=$(find source -name settings.gradle.kts -print -quit)

          test -n "$SETTINGS" || {
            echo "ERRO: settings.gradle.kts não encontrado."
            find source -maxdepth 4 -type f
            exit 1
          }

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          test -f "$PROJECT_DIR/app/build.gradle.kts"
          echo "Projeto encontrado em: $PROJECT_DIR"

      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" --no-daemon clean assembleDebug

      - name: Verify APK
        run: |
          test -s "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fortnite-AFK-Manager-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
